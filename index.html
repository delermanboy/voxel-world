      // Creative: all blocks available
      const allBlocks = [BLOCK.GRASS, BLOCK.DIRT, BLOCK.STONE, BLOCK.WOOD, BLOCK.LEAVES,
        BLOCK.SAND, BLOCK.PLANKS, BLOCK.STONE_BRICK, BLOCK.GLASS, BLOCK.COAL_ORE,
        BLOCK.IRON_ORE, BLOCK.GOLD_ORE, BLOCK.DIAMOND_ORE, BLOCK.GLOWSTONE, BLOCK.LIGHT_BLOCK,
        BLOCK.RED_FLOWER, BLOCK.YELLOW_FLOWER];
      for (const b of allBlocks) this._addBlock(b, 999);
      this._syncHotbar();
    } else if (mode === 'survival') {
      this._addBlock(BLOCK.DIRT, 32);
      this._addBlock(BLOCK.PLANKS, 16);
      this._addBlock(BLOCK.RAW_PORK, 5);
      this._syncHotbar();
    }
    // Adventure mode inventory set per level

    // Generate world
    if (mode === 'adventure') {
      this.world = new World(this.scene, this.texGen, false);
      this._initAdventureLevel(level);
    } else {
      this.world = new World(this.scene, this.texGen, true);
      // Pre-load initial chunks around spawn
      const spCx = 0, spCz = 0;
      for (let dx = -2; dx <= 2; dx++) {
        for (let dz = -2; dz <= 2; dz++) {
          const key = this.world.getChunkKey(spCx + dx, spCz + dz);
          if (!this.world.chunks.has(key)) {
            const chunk = new Chunk(spCx + dx, spCz + dz, this.world);
            chunk.generate(this.world.noise);
            chunk.buildMesh(this.texGen);
            this.world.chunks.set(key, chunk);
          }
        }
      }
    }

    // Position player
    const spawn = this.world.findSpawnPos();
    this.playerPos.copy(spawn);
    this.spawnPos.copy(spawn);
    this.camera.position.copy(this.playerPos);
    this.playerVel.set(0, 0, 0);

    // Spawn initial mobs (not in adventure)
    if (mode !== 'adventure') {
      this._spawnInitialMobs();
    }

    // Lock pointer
    this.controls.lock();
    this.isPlaying = true;
    this.clock.start();

    // Update HUD
    this._updateHealthUI();
    this._updateHotbarUI();
    this._updateHungerUI();
    this._updateEquipUI();

    // Start loop
    this._loop();
  }

  start() {
    // Legacy: start as creative
    this.startGame('creative');
  }

  pause() {
    this.isPlaying = false;
    this.controls.unlock();
    const modeNames = { creative: '创造模式', survival: '生存模式', adventure: '冒险模式' };
    document.getElementById('pauseModeLabel').textContent = modeNames[this.gameMode] || '';
    document.getElementById('pauseMenu').classList.remove('hidden');
    if (this.gameMode !== 'adventure') this.save.save(this);
  }

  resume() {
    document.getElementById('pauseMenu').classList.add('hidden');
    this.controls.lock();
    this.isPlaying = true;
    this.clock.start();
  }

  quit() {
    this.isPlaying = false;
    this.controls.unlock();
    // Clean up adventure stuff
    this.advActive = false;
    this.bossMob = null;
    document.getElementById('pauseMenu').classList.add('hidden');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('deathScreen').classList.remove('visible');
    document.getElementById('resultScreen').classList.remove('visible');
    document.getElementById('adventureHUD').classList.remove('visible');
    document.getElementById('bossHPBar').classList.remove('visible');
    document.getElementById('hungerBar').classList.remove('visible');
    document.getElementById('equipBar').classList.remove('visible');
    document.getElementById('waveInfo').classList.remove('visible');
    document.getElementById('startScreen').classList.remove('hidden');
    // Dispose old world and recreate
    if (this.world) {
      for (const chunk of this.world.chunks.values()) chunk.dispose();
      this.world.chunks.clear();
    }
    this.mobs.forEach(m => m.dispose(this.scene));
    this.mobs = [];
    this.droppedItems.forEach(d => d.dispose(this.scene));
    this.droppedItems = [];
  }

  openInventory() {
    if (!this.isPlaying) return;
    this.isInventoryOpen = true;
    this.controls.unlock();
    const grid = document.getElementById('invGrid');
    const allBlocks = Object.keys(this.inventory).map(Number).filter(b => this.inventory[b] > 0);

    let html = '';
    for (let i = 0; i < 36; i++) {
      const bid = i < allBlocks.length ? allBlocks[i] : null;
      const name = bid != null ? BLOCK_DATA[bid]?.name || '' : '';
      const count = bid != null ? this.inventory[bid] : 0;
      let iconHtml = '';
      if (bid != null && this.texGen.blockIcons[bid]) {
        iconHtml = `<canvas class="slot-icon" width="16" height="16" data-block="${bid}"></canvas>`;
      }
      html += `<div class="inv-slot" data-bid="${bid || ''}" title="${name}">
        ${iconHtml}
        ${count > 0 ? `<span class="slot-count">${count}</span>` : ''}
      </div>`;
    }
    grid.innerHTML = html;
    // Render icons
    for (const el of grid.querySelectorAll('.slot-icon')) {
      const bid = parseInt(el.dataset.block);
      const src = this.texGen.blockIcons[bid];
      if (src) {
        const ctx = el.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(src, 0, 0);
      }
    }

    document.getElementById('inventoryUI').classList.remove('hidden');
  }

  closeInventory() {
    this.isInventoryOpen = false;
    document.getElementById('inventoryUI').classList.add('hidden');
    this._syncHotbar();
    this._updateHotbarUI();
    if (this.isPlaying) this.controls.lock();
  }

  openCraft() {
    if (!this.isPlaying) return;
    this.isCraftOpen = true;
    this.controls.unlock();
    this._renderCraftList();
    document.getElementById('craftUI').classList.remove('hidden');
  }

  closeCraft() {
    this.isCraftOpen = false;
    document.getElementById('craftUI').classList.add('hidden');
    if (this.isPlaying) this.controls.lock();
  }

  _renderCraftList() {
    const list = document.getElementById('craftList');
    let html = '';
    for (const recipe of RECIPES) {
      const canCraft = recipe.input.every(([bid, cnt]) => (this.inventory[bid] || 0) >= cnt);
      const disabled = canCraft ? '' : ' disabled';
      const cls = canCraft ? 'craftable' : 'disabled';
      const inputStr = recipe.input.map(([bid, cnt]) => `${BLOCK_DATA[bid]?.name || '?'} x${cnt}`).join(' + ');
      const outputStr = recipe.output.map(([bid, cnt]) => `${BLOCK_DATA[bid]?.name || '?'} x${cnt}`).join(', ');
      const outBid = recipe.output[0][0];

      let iconHtml = '';
      if (this.texGen.blockIcons[outBid]) {
        iconHtml = `<canvas class="ci-icon" width="16" height="16" data-block="${outBid}"></canvas>`;
      }

      html += `<div class="craft-item${disabled}" data-idx="${RECIPES.indexOf(recipe)}">
        ${iconHtml}
        <div class="ci-info">
          <div class="ci-name">${recipe.name}</div>
          <div class="ci-recipe">${inputStr} → ${outputStr}</div>
        </div>
        <button class="ci-btn" ${canCraft ? '' : 'disabled'}>合成</button>
      </div>`;
    }
    list.innerHTML = html;

    // Render icons
    for (const el of list.querySelectorAll('.ci-icon')) {
      const bid = parseInt(el.dataset.block);
      const src = this.texGen.blockIcons[bid];
      if (src) {
        const ctx = el.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(src, 0, 0);
      }
    }

    // Click handlers
    for (const el of list.querySelectorAll('.craft-item')) {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx);
        this._craft(idx);
      });
    }
  }

  _craft(recipeIdx) {
    const recipe = RECIPES[recipeIdx];
    const canCraft = recipe.input.every(([bid, cnt]) => (this.inventory[bid] || 0) >= cnt);
    if (!canCraft) return;
    for (const [bid, cnt] of recipe.input) this._removeBlock(bid, cnt);
    for (const [bid, cnt] of recipe.output) this._addBlock(bid, cnt);
    this._syncHotbar();
    this._updateHotbarUI();
    this.sound.play('place');
    this._renderCraftList();
  }

  _spawnInitialMobs() {
    const types = ['pig', 'chicken', 'cow', 'sheep'];
    for (let i = 0; i < 12; i++) {
      const type = types[(Math.random() * types.length) | 0];
      const angle = Math.random() * Math.PI * 2;
      const dist = 10 + Math.random() * 30;
      const x = Math.cos(angle) * dist;
      const z = Math.sin(angle) * dist;
      const y = this.world.getHeight(Math.floor(x), Math.floor(z));
      if (y > SEA_LEVEL) {
        this.mobs.push(new Mob(this.scene, type, x, y, z));
      }
    }
  }

  _updatePhysics(dt) {
    if (this.isDead) return;
    dt = Math.min(dt, 0.05);

    // --- Creative flying ---
    if (this.isFlying && this.gameMode === 'creative') {
      const flyDir = new THREE.Vector3();
      this.camera.getWorldDirection(flyDir);
      const flyF = new THREE.Vector3(flyDir.x, 0, flyDir.z).normalize();
      const flyR = new THREE.Vector3().crossVectors(flyF, new THREE.Vector3(0, 1, 0)).normalize();
      let ix = 0, iz = 0;
      if (this.keys['KeyW']) iz += 1;
      if (this.keys['KeyS']) iz -= 1;
      if (this.keys['KeyA']) ix -= 1;
      if (this.keys['KeyD']) ix += 1;
      const il = Math.sqrt(ix * ix + iz * iz);
      if (il > 0) { ix /= il; iz /= il; }
      const fsp = MOVE_SPEED * 2;
      const tvx = (flyF.x * iz + flyR.x * ix) * fsp;
      const tvz = (flyF.z * iz + flyR.z * ix) * fsp;
      let tvy = 0;
      if (this.keys['Space']) tvy = fsp;
      if (this.keys['ShiftLeft'] || this.keys['ShiftRight']) tvy = -fsp;
      this.playerVel.x += (tvx - this.playerVel.x) * Math.min(1, 8 * dt);
      this.playerVel.y += (tvy - this.playerVel.y) * Math.min(1, 8 * dt);
      this.playerVel.z += (tvz - this.playerVel.z) * Math.min(1, 8 * dt);
      this.playerPos.x += this.playerVel.x * dt;
      this.playerPos.y += this.playerVel.y * dt;
      this.playerPos.z += this.playerVel.z * dt;
      if (!this.world.isInfinite) {
        const ws = WORLD_CHUNKS * CHUNK_SIZE / 2;
        this.playerPos.x = Math.max(-ws, Math.min(ws, this.playerPos.x));
        this.playerPos.z = Math.max(-ws, Math.min(ws, this.playerPos.z));
      }
      this.playerPos.y = Math.max(1, Math.min(CHUNK_HEIGHT - 2, this.playerPos.y));
      const bobOffset = Math.sin(this.headBob) * 0.06;
      this.camera.position.set(this.playerPos.x, this.playerPos.y + 1.6 + bobOffset, this.playerPos.z);
      return;
    }

    // --- Input ---
    const forward = new THREE.Vector3();
    this.camera.getWorldDirection(forward);
    forward.y = 0; forward.normalize();
    const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
    let ix = 0, iz = 0;
    if (this.keys['KeyW']) iz += 1;
    if (this.keys['KeyS']) iz -= 1;
    if (this.keys['KeyA']) ix -= 1;
    if (this.keys['KeyD']) ix += 1;
    const il = Math.sqrt(ix * ix + iz * iz);
    if (il > 0) { ix /= il; iz /= il; }
    const speed = (this.keys['ShiftLeft'] || this.keys['ShiftRight']) ? MOVE_SPEED * 1.6 : MOVE_SPEED;
    const tvx = (forward.x * iz + right.x * ix) * speed;
    const tvz = (forward.z * iz + right.z * ix) * speed;
    const friction = this.onGround ? 12 : 3;
    this.playerVel.x += (tvx - this.playerVel.x) * Math.min(1, friction * dt);
    this.playerVel.z += (tvz - this.playerVel.z) * Math.min(1, friction * dt);

    // Jump
    if (this.keys['Space'] && this.onGround) {
      this.playerVel.y = JUMP_VEL;
      this.onGround = false;
      if (this.gameMode === 'survival') this.hunger = Math.max(0, this.hunger - 0.2);
    }

    // Gravity + terminal velocity
    this.playerVel.y += GRAVITY * dt;
    if (this.playerVel.y < -40) this.playerVel.y = -40;

    // --- Sub-stepped AABB collision physics ---
    const SUBSTEPS = 8;
    const sdt = dt / SUBSTEPS;
    const HW = 0.3;
    const H = 1.8;
    const STEP = 0.5;

    const solidAt = (bx, by, bz) => {
      const b = this.world.getBlock(bx, by, bz);
      return b !== BLOCK.AIR && BLOCK_DATA[b]?.solid;
    };
    const overlaps = (minX, minY, minZ, maxX, maxY, maxZ) => {
      const x0 = Math.floor(minX), x1 = Math.floor(maxX - 1e-6);
      const y0 = Math.floor(minY), y1 = Math.floor(maxY - 1e-6);
      const z0 = Math.floor(minZ), z1 = Math.floor(maxZ - 1e-6);
      for (let bx = x0; bx <= x1; bx++)
        for (let by = y0; by <= y1; by++)
          for (let bz = z0; bz <= z1; bz++)
            if (solidAt(bx, by, bz)) return true;
      return false;
    };

    let wasOnGround = this.onGround;
    for (let s = 0; s < SUBSTEPS; s++) {
      // X
      this.playerPos.x += this.playerVel.x * sdt;
      if (overlaps(this.playerPos.x - HW, this.playerPos.y, this.playerPos.z - HW,
                   this.playerPos.x + HW, this.playerPos.y + H, this.playerPos.z + HW)) {
        if (wasOnGround && !overlaps(this.playerPos.x - HW, this.playerPos.y + STEP, this.playerPos.z - HW,
                                     this.playerPos.x + HW, this.playerPos.y + H + STEP, this.playerPos.z + HW)) {
          this.playerPos.y += STEP;
        } else {
          const ox = this.playerPos.x;
          const dir = this.playerVel.x > 0 ? -1 : 1;
          for (let p = 0.001; p <= 0.5; p += 0.001) {
            this.playerPos.x = ox + dir * p;
            if (!overlaps(this.playerPos.x - HW, this.playerPos.y, this.playerPos.z - HW,
                         this.playerPos.x + HW, this.playerPos.y + H, this.playerPos.z + HW)) break;
          }
          this.playerVel.x = 0;
        }
      }
      // Z
      this.playerPos.z += this.playerVel.z * sdt;
      if (overlaps(this.playerPos.x - HW, this.playerPos.y, this.playerPos.z - HW,
                   this.playerPos.x + HW, this.playerPos.y + H, this.playerPos.z + HW)) {
        if (wasOnGround && !overlaps(this.playerPos.x - HW, this.playerPos.y + STEP, this.playerPos.z - HW,
                                     this.playerPos.x + HW, this.playerPos.y + H + STEP, this.playerPos.z + HW)) {
          this.playerPos.y += STEP;
        } else {
          const oz = this.playerPos.z;
          const dir = this.playerVel.z > 0 ? -1 : 1;
          for (let p = 0.001; p <= 0.5; p += 0.001) {
            this.playerPos.z = oz + dir * p;
            if (!overlaps(this.playerPos.x - HW, this.playerPos.y, this.playerPos.z - HW,
                         this.playerPos.x + HW, this.playerPos.y + H, this.playerPos.z + HW)) break;
          }
          this.playerVel.z = 0;
        }
      }
      // Y
      this.playerPos.y += this.playerVel.y * sdt;
      if (overlaps(this.playerPos.x - HW, this.playerPos.y, this.playerPos.z - HW,
                   this.playerPos.x + HW, this.playerPos.y + H, this.playerPos.z + HW)) {
        if (this.playerVel.y < 0) {
          const by = Math.floor(this.playerPos.y);
          this.playerPos.y = by + 1;
          if (!wasOnGround) {
            this.landSquash = 1;
            this.headBobVel = -0.5;
            if (this.gameMode !== 'creative') {
              const fs = Math.abs(this.playerVel.y);
              if (fs > 15) this.takeDamage(Math.floor((fs - 15) * 0.5));
            }
          }
          this.onGround = true;
          this.playerVel.y = 0;
          wasOnGround = true;
        } else if (this.playerVel.y > 0) {
          const by = Math.floor(this.playerPos.y + H);
          this.playerPos.y = by - H;
          this.playerVel.y = 0;
        } else {
          this.playerPos.y += 0.1;
        }
      }
    }

    // Reliable ground check
    const footY = this.playerPos.y - 0.001;
    this.onGround = overlaps(this.playerPos.x - HW, footY, this.playerPos.z - HW,
                             this.playerPos.x + HW, footY + 0.002, this.playerPos.z + HW);

    // Boundary + void
    if (!this.world.isInfinite) {
      const ws = WORLD_CHUNKS * CHUNK_SIZE / 2;
      this.playerPos.x = Math.max(-ws, Math.min(ws, this.playerPos.x));
      this.playerPos.z = Math.max(-ws, Math.min(ws, this.playerPos.z));
    }
    this.playerPos.y = Math.max(1, Math.min(CHUNK_HEIGHT - 2, this.playerPos.y));
    if (this.playerPos.y < -10) this.health = 0;

    // Camera
    const spd2d = Math.sqrt(this.playerVel.x ** 2 + this.playerVel.z ** 2);
    if (this.onGround && spd2d > 0.5) this.headBob += spd2d * 12 * dt;
    const bobOffset = Math.sin(this.headBob) * 0.06 + this.headBobVel;
    this.headBobVel *= 0.9;
    if (this.landSquash > 0) { this.landSquash -= dt * 4; if (this.landSquash < 0) this.landSquash = 0; }
    this.camera.position.set(
      this.playerPos.x,
      this.playerPos.y + 1.6 + bobOffset - this.landSquash * 0.1,
      this.playerPos.z
    );
  }

  _updateInteraction(dt) {
    if (this.isInventoryOpen || this.isCraftOpen || this.isDead) return;

    const dir = new THREE.Vector3();
    this.camera.getWorldDirection(dir);
    const hit = raycast(this.world, this.camera.position, dir, REACH);

    if (hit) {
      this.highlightMesh.visible = true;
      this.highlightMesh.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5);

      // Left click - break
      if (this.mouse.left) {
        if (!this.breakTarget || this.breakTarget.x !== hit.x || this.breakTarget.y !== hit.y || this.breakTarget.z !== hit.z) {
          this.breakTarget = { x: hit.x, y: hit.y, z: hit.z };
          this.breakProgress = 0;
        }

        // Creative: instant break
        if (this.gameMode === 'creative') {
          if (hit.block !== BLOCK.BEDROCK) {
            const color = this._getBlockThreeColor(hit.block);
            this.particles.emit(hit.x, hit.y, hit.z, color, 6);
            this.world.setBlock(hit.x, hit.y, hit.z, BLOCK.AIR);
            this.sound.play('break');
          }
          this.breakProgress = 0;
          this.breakTarget = null;
        } else {
          // Survival: tool speed affects break time
          let breakSpeed = 2;
          const heldItem = this.hotbar[this.hotbarIdx];
          if (heldItem && BLOCK_DATA[heldItem]?.isTool) {
            const ts = BLOCK_DATA[heldItem].toolSpeed || 1;
            // Apply tool speed for appropriate blocks
            if (hit.block === BLOCK.STONE || hit.block === BLOCK.COAL_ORE ||
                hit.block === BLOCK.IRON_ORE || hit.block === BLOCK.GOLD_ORE || hit.block === BLOCK.DIAMOND_ORE) {
              breakSpeed *= ts;
            }
          }
          this.breakProgress += dt * breakSpeed;
          if (this.breakProgress >= 1) {
            if (hit.block !== BLOCK.BEDROCK) {
              const color = this._getBlockThreeColor(hit.block);
              this.particles.emit(hit.x, hit.y, hit.z, color, 6);
              this.droppedItems.push(new DroppedItem(this.scene, hit.block, hit.x, hit.y, hit.z));
              this.world.setBlock(hit.x, hit.y, hit.z, BLOCK.AIR);
              this.sound.play('break');
            }
            this.breakProgress = 0;
            this.breakTarget = null;
          }
        }
      }
    } else {
      this.highlightMesh.visible = false;
      this.breakTarget = null;
      this.breakProgress = 0;
    }

    // Right click - place / eat food
    if (this.mouse.right) {
      const selectedBlock = this.hotbar[this.hotbarIdx];

      // Check if holding food (survival mode)
      if (this.gameMode === 'survival' && selectedBlock != null && BLOCK_DATA[selectedBlock]?.isFood) {
        this.isEating = true;
        this.eatingProgress += dt;
        const ep = document.getElementById('eatProgress');
        ep.classList.add('visible');
        document.getElementById('eatFill').style.width = (this.eatingProgress / 2 * 100) + '%';

        if (this.eatingProgress >= 2) {
          // Eat the food
          const foodData = BLOCK_DATA[selectedBlock];
          this.hunger = Math.min(this.maxHunger, this.hunger + (foodData.hunger || 2));
          this._removeBlock(selectedBlock, 1);
          this._syncHotbar();
          this._updateHotbarUI();
          this._updateHungerUI();
          this.sound.play('hit');
          this.isEating = false;
          this.eatingProgress = 0;
          this.mouse.right = false;
          ep.classList.remove('visible');
        }
        return; // Don't place while eating
      }

      if (hit) {
        this.mouse.right = false; // one-time place
        const [nx, ny, nz] = getFaceNormal(hit.face);
        const px = hit.x + nx, py = hit.y + ny, pz = hit.z + nz;

        // Don't place inside player
        const playerBox = {
          minX: this.playerPos.x - 0.3, maxX: this.playerPos.x + 0.3,
          minY: this.playerPos.y, maxY: this.playerPos.y + 1.8,
          minZ: this.playerPos.z - 0.3, maxZ: this.playerPos.z + 0.3,
        };
        const blockBox = { minX: px, maxX: px + 1, minY: py, maxY: py + 1, minZ: pz, maxZ: pz + 1 };
        if (playerBox.maxX > blockBox.minX && playerBox.minX < blockBox.maxX &&
            playerBox.maxY > blockBox.minY && playerBox.minY < blockBox.maxY &&
            playerBox.maxZ > blockBox.minZ && playerBox.minZ < blockBox.maxZ) return;

        // Creative: infinite blocks
        if (this.gameMode === 'creative') {
          if (selectedBlock != null) {
            if (this.world.getBlock(px, py, pz) === BLOCK.AIR || this.world.getBlock(px, py, pz) === BLOCK.WATER) {
              this.world.setBlock(px, py, pz, selectedBlock);
              this.sound.play('place');
            }
          }
        } else {
          if (selectedBlock != null && this.inventory[selectedBlock] > 0) {
            if (this.world.getBlock(px, py, pz) === BLOCK.AIR || this.world.getBlock(px, py, pz) === BLOCK.WATER) {
              this.world.setBlock(px, py, pz, selectedBlock);
              this._removeBlock(selectedBlock, 1);
              this._updateHotbarUI();
              this.sound.play('place');
            }
          }
        }
      }
    }
  }

  _getBlockThreeColor(blockId) {
    const colors = {
      [BLOCK.GRASS]: 0x4caf50, [BLOCK.DIRT]: 0x8b6914, [BLOCK.STONE]: 0x808080,
      [BLOCK.WOOD]: 0x8b6914, [BLOCK.LEAVES]: 0x3a9f30, [BLOCK.SAND]: 0xe8d5a0,
      [BLOCK.COAL_ORE]: 0x333333, [BLOCK.IRON_ORE]: 0xd4b896, [BLOCK.GOLD_ORE]: 0xffd700,
      [BLOCK.DIAMOND_ORE]: 0x40e0d0, [BLOCK.PLANKS]: 0xbc9862, [BLOCK.STONE_BRICK]: 0x7a7a7a,
      [BLOCK.GLASS]: 0xc8dcff, [BLOCK.RED_FLOWER]: 0xe03030, [BLOCK.YELLOW_FLOWER]: 0xf0e040,
    };
    return colors[blockId] || 0xaaaaaa;
  }

  _updateMobs(dt) {
    if (this.isDead) return;

    // Adventure mode: update boss
    if (this.gameMode === 'adventure' && this.bossMob) {
      this._updateBoss(dt);
    }

    // Survival mode: wave system at night
    if (this.gameMode === 'survival') {
      const isNight = this.dayTime < 0.25 || this.dayTime > 0.75;
      if (!isNight) {
        this.waveNumber = 0;
        this.waveTimer = 0;
        document.getElementById('waveInfo').classList.remove('visible');
      } else {
        this.waveTimer += dt;
        if (this.waveTimer >= 30) {
          this.waveTimer = 0;
          this.waveNumber++;
          this._spawnWave(this.waveNumber);
          document.getElementById('waveInfo').textContent = '波次 ' + this.waveNumber;
          document.getElementById('waveInfo').classList.add('visible');
        }
      }
    }

    // Default spawn timer (creative / survival non-wave)
    this.mobSpawnTimer += dt;
    if (this.mobSpawnTimer > 10 && this.mobs.length < 20 && this.gameMode !== 'adventure') {
      this.mobSpawnTimer = 0;
      const isNight = this.dayTime < 0.25 || this.dayTime > 0.75;
      if (this.gameMode === 'survival') {
        // In survival, only spawn passive mobs during day
        if (!isNight && this.mobs.filter(m => m.type !== 'zombie' && m.type !== 'skeleton').length < 8) {
          const types = ['pig', 'chicken', 'cow', 'sheep'];
          const type = types[(Math.random() * types.length) | 0];
          const angle = Math.random() * Math.PI * 2;
          const dist = 15 + Math.random() * 25;
          const x = this.playerPos.x + Math.cos(angle) * dist;
          const z = this.playerPos.z + Math.sin(angle) * dist;
          const y = this.world.getHeight(Math.floor(x), Math.floor(z));
          if (y > SEA_LEVEL) {
            const mob = new Mob(this.scene, type, x, y, z);
            this.mobs.push(mob);
          }
        }
      } else if (this.gameMode === 'creative') {
        // Creative: spawn both
        const isNight2 = this.dayTime < 0.25 || this.dayTime > 0.75;
        if (isNight2) {
          const angle = Math.random() * Math.PI * 2;
          const dist = 20 + Math.random() * 20;
          const x = this.playerPos.x + Math.cos(angle) * dist;
          const z = this.playerPos.z + Math.sin(angle) * dist;
          const y = this.world.getHeight(Math.floor(x), Math.floor(z));
          if (y > SEA_LEVEL) {
            const type = Math.random() < 0.5 ? 'zombie' : 'skeleton';
            this.mobs.push(new Mob(this.scene, type, x, y, z));
          }
        } else if (this.mobs.filter(m => m.type !== 'zombie' && m.type !== 'skeleton').length < 8) {
          const types = ['pig', 'chicken', 'cow', 'sheep'];
          const type = types[(Math.random() * types.length) | 0];
          const angle = Math.random() * Math.PI * 2;
          const dist = 15 + Math.random() * 25;
          const x = this.playerPos.x + Math.cos(angle) * dist;
          const z = this.playerPos.z + Math.sin(angle) * dist;
          const y = this.world.getHeight(Math.floor(x), Math.floor(z));
          if (y > SEA_LEVEL) {
            this.mobs.push(new Mob(this.scene, type, x, y, z));
          }
        }
      }
    }

    // Update mobs
    const playerCenter = new THREE.Vector3(
      this.playerPos.x, this.playerPos.y + 0.9, this.playerPos.z
    );

    for (let i = this.mobs.length - 1; i >= 0; i--) {
      const mob = this.mobs[i];
      const result = mob.update(dt, playerCenter, this.world);

      if (result === true) {
        // Mob dead or despawned
        // Survival: give XP for killing hostile mobs
        if (this.gameMode === 'survival' && (mob.type === 'zombie' || mob.type === 'skeleton') && mob.deathTimer >= 0) {
          this.xp += mob.type === 'zombie' ? 5 : 8;
          this._showXPPopup(mob.pos);
          // Chance to drop items
          if (Math.random() < 0.3) {
            this.droppedItems.push(new DroppedItem(this.scene, BLOCK.RAW_PORK, mob.pos.x, mob.pos.y, mob.pos.z));
          }
        }
        mob.dispose(this.scene);
        this.mobs.splice(i, 1);
        continue;
      }

      if (result && result.attack) {
        // Creative mode: no damage
        if (this.gameMode !== 'creative') {
          let dmg = result.damage;
          // Boss deals more damage
          if (mob === this.bossMob) dmg = 5;
          // Armor reduction
          if (this.equipment[1] != null) dmg = Math.max(1, dmg - 2);
          this.takeDamage(dmg);
        }
      }

      // Despawn far mobs
      const dist = mob.pos.distanceTo(playerCenter);
      if (dist > 80) {
        mob.dispose(this.scene);
        this.mobs.splice(i, 1);
      }
    }
  }

  _spawnWave(waveNum) {
    const zombieCount = 3 + (waveNum - 1) * 2;
    const skeletonCount = Math.max(0, (waveNum - 1));
    for (let i = 0; i < zombieCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 10;
      const x = this.playerPos.x + Math.cos(angle) * dist;
      const z = this.playerPos.z + Math.sin(angle) * dist;
      const y = this.world.getHeight(Math.floor(x), Math.floor(z));
      if (y > 0) {
        const mob = new Mob(this.scene, 'zombie', x, y, z);
        // Stronger with higher waves
        mob.health = 20 + (waveNum - 1) * 5;
        mob.maxHealth = mob.health;
        this.mobs.push(mob);
      }
    }
    for (let i = 0; i < skeletonCount; i++) {
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 10;
      const x = this.playerPos.x + Math.cos(angle) * dist;
      const z = this.playerPos.z + Math.sin(angle) * dist;
      const y = this.world.getHeight(Math.floor(x), Math.floor(z));
      if (y > 0) {
        const mob = new Mob(this.scene, 'skeleton', x, y, z);
        mob.health = 20 + (waveNum - 1) * 3;
        mob.maxHealth = mob.health;
        this.mobs.push(mob);
      }
    }
  }

  _showXPPopup(pos) {
    const popup = document.createElement('div');
    popup.className = 'xp-popup';
    popup.textContent = '+' + this.xp + ' XP';
    // Position in screen space (approximate)
    popup.style.left = (window.innerWidth / 2) + 'px';
    popup.style.top = (window.innerHeight / 2 - 30) + 'px';
    document.body.appendChild(popup);
    setTimeout(() => popup.remove(), 1000);
  }

  _updateDroppedItems(dt) {
    const pp = this.playerPos;
    for (let i = this.droppedItems.length - 1; i >= 0; i--) {
      const item = this.droppedItems[i];
      const collected = item.update(dt, pp, this.world);
      if (collected || item.collected) {
        if (item.collected) {
          this._addBlock(item.blockId, 1);
          this._syncHotbar();
          this._updateHotbarUI();
          this.sound.play('hit');
        }
        item.dispose(this.scene);
        this.droppedItems.splice(i, 1);
      } else if (item.life <= 0) {
        item.dispose(this.scene);
        this.droppedItems.splice(i, 1);
      }
    }
  }

  _updateDayNight(dt) {
    this.dayTime = (this.dayTime + this.daySpeed * dt) % 1;

    // Sun angle
    const sunAngle = this.dayTime * Math.PI * 2 - Math.PI / 2;
    const sunDist = 70;
    this.sunLight.position.set(
      Math.cos(sunAngle) * sunDist,
      Math.sin(sunAngle) * sunDist,
      30
    );

    // Position sun/moon meshes (follow camera xz so they always appear in sky)
    const camX = this.playerPos.x, camZ = this.playerPos.z;
    this.sunMesh.position.set(
      camX + Math.cos(sunAngle) * sunDist,
      Math.sin(sunAngle) * sunDist,
      camZ + 30
    );
    this.sunMesh.visible = Math.sin(sunAngle) > -0.2;
    this.moonMesh.position.set(
      camX + Math.cos(sunAngle + Math.PI) * sunDist,
      Math.sin(sunAngle + Math.PI) * sunDist,
      camZ + 30
    );
    this.moonMesh.visible = Math.sin(sunAngle) < 0.2;

    // Light intensity based on time
    const sunHeight = Math.sin(sunAngle);
    const dayFactor = Math.max(0, Math.min(1, sunHeight * 2 + 0.5));

    this.sunLight.intensity = dayFactor * 1.0;
    this.ambientLight.intensity = 0.15 + dayFactor * 0.5;
    this.hemiLight.intensity = 0.1 + dayFactor * 0.3;

    // Sky color
    const nightColor = new THREE.Color(0x0a0a1a);
    const dayColor = new THREE.Color(0x87ceeb);
    const sunsetColor = new THREE.Color(0xff8844);

    let skyColor;
    if (dayFactor > 0.6) {
      skyColor = dayColor;
    } else if (dayFactor > 0.3) {
      const t = (dayFactor - 0.3) / 0.3;
      skyColor = sunsetColor.clone().lerp(dayColor, t);
    } else {
      const t = dayFactor / 0.3;
      skyColor = nightColor.clone().lerp(sunsetColor, t);
    }

    this.scene.background = skyColor;
    this.scene.fog.color = skyColor;

    // Move clouds
    for (const cloud of this.cloudMeshes) {
      cloud.mesh.position.x += cloud.speed * dt;
      if (cloud.mesh.position.x > 60) cloud.mesh.position.x = -60;
    }
  }

  takeDamage(amount) {
    if (this.health <= 0 || this.isDead) return;
    if (this.gameMode === 'creative') return; // Creative: no damage
    this.health = Math.max(0, this.health - amount);
    this.sound.play('hurt');
    this._updateHealthUI();

    // Flash damage overlay
    const overlay = document.getElementById('damageOverlay');
    overlay.classList.add('active');
    setTimeout(() => overlay.classList.remove('active'), 200);

    if (this.health <= 0) {
      this._die();
    }
  }

  _die() {
    this.isDead = true;
    this.deathTimer = 5;
    document.getElementById('deathTimer').textContent = '5';

    if (this.gameMode === 'adventure') {
      this.advLives--;
      if (this.advLives <= 0) {
        // Game over for adventure
        this._showResult(false, this.advTitle, '所有生命已耗尽');
        return;
      }
    }

    if (this.gameMode === 'survival') {
      document.getElementById('deathScreen').classList.add('visible');
      this.controls.unlock();
      // Death countdown
      const countdown = setInterval(() => {
        this.deathTimer--;
        if (this.deathTimer <= 0) {
          clearInterval(countdown);
          this._respawn();
        } else {
          document.getElementById('deathTimer').textContent = this.deathTimer;
        }
      }, 1000);
    } else if (this.gameMode === 'adventure') {
      document.getElementById('deathScreen').classList.add('visible');
      this.controls.unlock();
      const countdown = setInterval(() => {
        this.deathTimer--;
        if (this.deathTimer <= 0) {
          clearInterval(countdown);
          this._respawn();
        } else {
          document.getElementById('deathTimer').textContent = this.deathTimer;
        }
      }, 1000);
    } else {
      this._respawn();
    }
  }

  _respawn() {
    this.isDead = false;
    this.health = this.maxHealth;
    if (this.gameMode === 'survival') {
      this.hunger = 10;
      // Lose half inventory
      for (const key in this.inventory) {
        this.inventory[key] = Math.floor(this.inventory[key] / 2);
        if (this.inventory[key] <= 0) delete this.inventory[key];
      }
      this._syncHotbar();
    }
    this._updateHealthUI();
    this._updateHungerUI();
    this._updateHotbarUI();

    this.playerPos.copy(this.spawnPos);
    this.playerVel.set(0, 0, 0);
    this.camera.position.copy(this.playerPos);

    document.getElementById('deathScreen').classList.remove('visible');
    if (this.isPlaying) this.controls.lock();
  }

  _attackMob() {
    const dir = new THREE.Vector3();
    this.camera.getWorldDirection(dir);
    const origin = this.camera.position.clone();
    const range = REACH;

    // Simple ray-sphere intersection with mobs
    let closestMob = null;
    let closestDist = range;

    for (const mob of this.mobs) {
      if (mob.deathTimer >= 0) continue;
      const toMob = mob.pos.clone().add(new THREE.Vector3(0, 0.6, 0)).sub(origin);
      const proj = toMob.dot(dir);
      if (proj < 0 || proj > range) continue;
      const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
      const dist = closest.distanceTo(mob.pos.clone().add(new THREE.Vector3(0, 0.6, 0)));
      if (dist < 0.8 && proj < closestDist) {
        closestDist = proj;
        closestMob = mob;
      }
    }

    if (closestMob) {
      const dead = closestMob.takeDamage(4);
      this.sound.play('hit');
      // Knockback
      const kbDir = closestMob.pos.clone().sub(this.playerPos).normalize();
      closestMob.vel.x += kbDir.x * 5;
      closestMob.vel.z += kbDir.z * 5;
      closestMob.state = 'fleeing';
      closestMob.walkTimer = 1;

      if (dead) {
        // Drop item
        if (Math.random() < 0.5) {
          // Drop some item
        }
      }
    }
  }

  _loop() {
    if (!this.isPlaying) return;
    requestAnimationFrame(() => this._loop());

    const dt = Math.min(this.clock.getDelta(), 0.1);
    this.accumulatedTime += dt;

    // Fixed timestep for physics
    while (this.accumulatedTime >= TICK_RATE) {
      this._updatePhysics(TICK_RATE);
      this.accumulatedTime -= TICK_RATE;
    }

    if (!this.isDead) {
      // Dynamic chunk loading for infinite world
      this.world.updateChunks(this.playerPos.x, this.playerPos.z, this.scene, this.texGen);

      this._updateInteraction(dt);
      this._updateMobs(dt);
      this._updateDroppedItems(dt);

      // Survival: hunger system
      if (this.gameMode === 'survival') {
        this.hunger = Math.max(0, this.hunger - 0.03 * dt);
        // Sprint hunger cost
        if (this.keys['ShiftLeft'] || this.keys['ShiftRight']) {
          const isMoving = Math.abs(this.playerVel.x) + Math.abs(this.playerVel.z) > 1;
          if (isMoving) this.hunger = Math.max(0, this.hunger - 0.05 * dt);
        }
        // Hunger damage
        if (this.hunger <= 0) {
          this.takeDamage(2 * dt);
        } else if (this.hunger < 3) {
          this.takeDamage(0.5 * dt);
        }
        this._updateHungerUI();
      }

      // Adventure mode updates
      if (this.gameMode === 'adventure' && this.advActive) {
        this._updateAdventure(dt);
      }
    }

    this.particles.update(dt);
    this._updateDayNight(dt);

    // FPS counter
    this._fpsFrames++;
    this._fpsTime += dt;
    if (this._fpsTime >= 1) {
      this._fpsValue = this._fpsFrames / this._fpsTime;
      this._fpsFrames = 0;
      this._fpsTime = 0;
    }

    this._updateDebugInfo();

    this.renderer.render(this.scene, this.camera);
  }

  // ============================================================
  //  ADVENTURE MODE
  // ============================================================
  _initAdventureLevel(level) {
    this.world.generate();
    this.advActive = true;
    this.advStartTime = performance.now();
    this.advLives = level === 3 ? 3 : 1;
    this.health = this.maxHealth;

    if (level === 1) {
      this._buildMazeLevel();
    } else if (level === 2) {
      this._buildSiegeLevel();
    } else if (level === 3) {
      this._buildBossLevel();
    }
  }

  _updateAdventure(dt) {
    if (this.adventureLevel === 1) {
      // Maze: check if reached end
      if (this.mazeEnd) {
        const dx = this.playerPos.x - this.mazeEnd.x;
        const dz = this.playerPos.z - this.mazeEnd.z;
        if (Math.abs(dx) < 2 && Math.abs(dz) < 2) {
          this.advActive = false;
          const elapsed = ((performance.now() - this.advStartTime) / 1000).toFixed(1);
          this._showResult(true, '迷宫逃脱', '用时 ' + elapsed + ' 秒');
        }
      }
      // Update timer
      const elapsed = ((performance.now() - this.advStartTime) / 1000).toFixed(1);
      document.getElementById('advTimer').textContent = elapsed + 's';
    } else if (this.adventureLevel === 2) {
      // Siege: survive 5 minutes
      const elapsed = (performance.now() - this.advStartTime) / 1000;
      const remaining = Math.max(0, 300 - elapsed);
      document.getElementById('advTimer').textContent = this._formatTime(remaining);

      // Spawn waves every 15 seconds
      this.waveTimer += dt;
      if (this.waveTimer >= 15) {
        this.waveTimer = 0;
        this.waveNumber++;
        this._spawnSiegeWave();
      }

      // Show wave info
      if (this.waveNumber > 0) {
        document.getElementById('advObjective').textContent = '波次 ' + this.waveNumber + ' | 坚持 ' + this._formatTime(remaining);
      }

      if (remaining <= 0) {
        this.advActive = false;
        this._showResult(true, '僵尸围城', '成功生存 5 分钟');
      }
    } else if (this.adventureLevel === 3) {
      // Boss: update boss HP bar
      if (this.bossMob) {
        const hpPct = Math.max(0, this.bossMob.health / this.bossMob.maxHealth * 100);
        document.getElementById('bossHPFill').style.width = hpPct + '%';
        document.getElementById('bossName').textContent = '巨型僵尸 HP: ' + Math.ceil(this.bossMob.health) + '/' + this.bossMob.maxHealth;
      }
      // Lives
      document.getElementById('advLives').textContent = '生命: ' + this.advLives;
      // Timer
      const elapsed = ((performance.now() - this.advStartTime) / 1000).toFixed(1);
      document.getElementById('advTimer').textContent = elapsed + 's';
    }
  }

  _formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  _showResult(won, title, subtitle) {
    document.getElementById('resultTitle').textContent = won ? '通关!' : '失败';
    document.getElementById('resultTitle').style.color = won ? '#5eead4' : '#f87171';
    document.getElementById('resultSub').textContent = title;
    document.getElementById('resultTime').textContent = subtitle;
    document.getElementById('resultScreen').classList.add('visible');
    this.isPlaying = false;
    this.controls.unlock();
    this.advActive = false;
  }

  _buildMazeLevel() {
    // Generate a 32x32 maze using recursive backtracking
    const mazeW = 32, mazeH = 32;
    const maze = this._generateMaze(mazeW, mazeH);

    // Build maze walls in the world (centered at origin)
    const offsetX = -Math.floor(mazeW / 2);
    const offsetZ = -Math.floor(mazeH / 2);
    const wallHeight = 4;
    const baseY = SEA_LEVEL;

    for (let mz = 0; mz < mazeH; mz++) {
      for (let mx = 0; mx < mazeW; mx++) {
        const cell = maze[mz][mx];
        const wx = offsetX + mx;
        const wz = offsetZ + mz;

        // Floor
        this.world.setBlock(wx, baseY, wz, BLOCK.STONE_BRICK);

        // Walls
        if (cell.north) {
          for (let y = 1; y <= wallHeight; y++) {
            this.world.setBlock(wx, baseY + y, wz, BLOCK.STONE_BRICK);
          }
        }
        if (cell.west) {
          for (let y = 1; y <= wallHeight; y++) {
            this.world.setBlock(wx, baseY + y, wz, BLOCK.STONE_BRICK);
          }
        }
        if (mx === mazeW - 1 && cell.east) {
          for (let y = 1; y <= wallHeight; y++) {
            this.world.setBlock(wx + 1, baseY + y, wz, BLOCK.STONE_BRICK);
          }
        }
        if (mz === mazeH - 1 && cell.south) {
          for (let y = 1; y <= wallHeight; y++) {
            this.world.setBlock(wx, baseY + y, wz + 1, BLOCK.STONE_BRICK);
          }
        }
      }
    }

    // Outer boundary walls
    for (let x = offsetX - 1; x <= offsetX + mazeW; x++) {
      for (let y = 1; y <= wallHeight + 1; y++) {
        this.world.setBlock(x, baseY + y, offsetZ - 1, BLOCK.STONE_BRICK);
        this.world.setBlock(x, baseY + y, offsetZ + mazeH, BLOCK.STONE_BRICK);
      }
    }
    for (let z = offsetZ - 1; z <= offsetZ + mazeH; z++) {
      for (let y = 1; y <= wallHeight + 1; y++) {
        this.world.setBlock(offsetX - 1, baseY + y, z, BLOCK.STONE_BRICK);
        this.world.setBlock(offsetX + mazeW, baseY + y, z, BLOCK.STONE_BRICK);
      }
    }

    // Start and end markers (glowstone pillars)
    this.mazeStart = { x: offsetX + 0.5, z: offsetZ + 0.5 };
    this.mazeEnd = { x: offsetX + mazeW - 0.5, z: offsetZ + mazeH - 0.5 };

    // Start glow
    for (let y = 1; y <= wallHeight + 2; y++) {
      this.world.setBlock(offsetX, baseY + y, offsetZ, BLOCK.GLOWSTONE);
    }
    // End glow
    for (let y = 1; y <= wallHeight + 2; y++) {
      this.world.setBlock(offsetX + mazeW - 1, baseY + y, offsetZ + mazeH - 1, BLOCK.GLOWSTONE);
    }

    // Clear start and end cells
    for (let y = 1; y <= wallHeight; y++) {
      this.world.setBlock(offsetX, baseY + y, offsetZ, BLOCK.AIR);
      this.world.setBlock(offsetX + mazeW - 1, baseY + y, offsetZ + mazeH - 1, BLOCK.AIR);
    }

    // Rebuild chunks in maze area
    this._rebuildArea(offsetX - 2, offsetZ - 2, offsetX + mazeW + 2, offsetZ + mazeH + 2);

    // Place player at start
    this.playerPos.set(offsetX + 0.5, baseY + 1.5, offsetZ + 0.5);
    this.spawnPos.copy(this.playerPos);

    // UI
    document.getElementById('advTitle').textContent = '迷宫逃脱';
    document.getElementById('advObjective').textContent = '找到迷宫出口';
    document.getElementById('advTimer').textContent = '0.0s';
    document.getElementById('advLives').textContent = '';
  }

  _generateMaze(width, height) {
    // Recursive backtracking algorithm
    const cells = [];
    for (let z = 0; z < height; z++) {
      cells[z] = [];
      for (let x = 0; x < width; x++) {
        cells[z][x] = { visited: false, north: true, south: true, east: true, west: true };
      }
    }

    const stack = [];
    const start = { x: 0, z: 0 };
    cells[0][0].visited = true;
    stack.push(start);

    while (stack.length > 0) {
      const current = stack[stack.length - 1];
      const neighbors = [];

      // Check all 4 neighbors
      const dirs = [
        { dx: 0, dz: -1, wall: 'north', opposite: 'south' },
        { dx: 0, dz: 1, wall: 'south', opposite: 'north' },
        { dx: 1, dz: 0, wall: 'east', opposite: 'west' },
        { dx: -1, dz: 0, wall: 'west', opposite: 'east' },
      ];

      for (const d of dirs) {
        const nx = current.x + d.dx;
        const nz = current.z + d.dz;
        if (nx >= 0 && nx < width && nz >= 0 && nz < height && !cells[nz][nx].visited) {
          neighbors.push({ x: nx, z: nz, wall: d.wall, opposite: d.opposite });
        }
      }

      if (neighbors.length > 0) {
        const next = neighbors[(Math.random() * neighbors.length) | 0];
        // Remove wall between current and next
        cells[current.z][current.x][next.wall] = false;
        cells[next.z][next.x][next.opposite] = false;
        cells[next.z][next.x].visited = true;
        stack.push({ x: next.x, z: next.z });
      } else {
        stack.pop();
      }
    }

    return cells;
  }

  _rebuildArea(x1, z1, x2, z2) {
    const cx1 = Math.floor(x1 / CHUNK_SIZE);
    const cz1 = Math.floor(z1 / CHUNK_SIZE);
    const cx2 = Math.floor(x2 / CHUNK_SIZE);
    const cz2 = Math.floor(z2 / CHUNK_SIZE);
    for (let cx = cx1; cx <= cx2; cx++) {
      for (let cz = cz1; cz <= cz2; cz++) {
        const chunk = this.world.getChunk(cx, cz);
        if (chunk) chunk.buildMesh(this.world.texGen);
      }
    }
  }

  _buildSiegeLevel() {
    const size = 24;
    const half = Math.floor(size / 2);
    const baseY = SEA_LEVEL;
    const wallHeight = 6;

    // Floor
    for (let x = -half; x < half; x++) {
      for (let z = -half; z < half; z++) {
        this.world.setBlock(x, baseY, z, BLOCK.STONE_BRICK);
      }
    }

    // Walls
    for (let i = -half; i < half; i++) {
      for (let y = 1; y <= wallHeight; y++) {
        this.world.setBlock(i, baseY + y, -half, BLOCK.STONE_BRICK);
        this.world.setBlock(i, baseY + y, half - 1, BLOCK.STONE_BRICK);
        this.world.setBlock(-half, baseY + y, i, BLOCK.STONE_BRICK);
        this.world.setBlock(half - 1, baseY + y, i, BLOCK.STONE_BRICK);
      }
    }

    // Some obstacles inside
    const obstacles = [
      { x: -5, z: -5, w: 3, h: 3 }, { x: 5, z: 5, w: 3, h: 3 },
      { x: -5, z: 5, w: 2, h: 2 }, { x: 5, z: -5, w: 2, h: 2 },
      { x: 0, z: -8, w: 4, h: 1 }, { x: 0, z: 8, w: 4, h: 1 },
    ];
    for (const ob of obstacles) {
      for (let x = ob.x; x < ob.x + ob.w; x++) {
        for (let z = ob.z; z < ob.z + ob.h; z++) {
          for (let y = 1; y <= 3; y++) {
            this.world.setBlock(x, baseY + y, z, BLOCK.STONE);
          }
        }
      }
    }

    this._rebuildArea(-half - 1, -half - 1, half + 1, half + 1);

    // Player at center
    this.playerPos.set(0.5, baseY + 1.5, 0.5);
    this.spawnPos.copy(this.playerPos);
    this.waveTimer = 0;
    this.waveNumber = 0;

    // Give player some weapons
    this._addBlock(BLOCK.IRON_SWORD, 1);
    this._addBlock(BLOCK.STONE, 32);
    this._addBlock(BLOCK.PLANKS, 16);
    this._syncHotbar();

    // UI
    document.getElementById('advTitle').textContent = '僵尸围城';
    document.getElementById('advObjective').textContent = '坚持 5 分钟';
    document.getElementById('advTimer').textContent = '5:00';
    document.getElementById('advLives').textContent = '';
    document.getElementById('bossHPBar').classList.remove('visible');
  }

  _spawnSiegeWave() {
    const size = 24;
    const half = Math.floor(size / 2);
    const baseY = SEA_LEVEL;
    const count = 3 + this.waveNumber * 2;
    const baseYActual = this.world.getHeight(0, 0) + 1;

    for (let i = 0; i < count; i++) {
      const side = (Math.random() * 4) | 0;
      let x, z;
      const offset = -half + 1 + Math.random() * (size - 2);
      switch (side) {
        case 0: x = -half + 1; z = offset; break; // north wall
        case 1: x = half - 2; z = offset; break;  // south wall
        case 2: x = offset; z = -half + 1; break;  // west wall
        case 3: x = offset; z = half - 2; break;   // east wall
      }
      const y = baseYActual;
      const mob = new Mob(this.scene, 'zombie', x, y, z);
      mob.health = 20 + this.waveNumber * 3;
      mob.maxHealth = mob.health;
      this.mobs.push(mob);
    }
  }

  _buildBossLevel() {
    const size = 32;
    const half = Math.floor(size / 2);
    const baseY = SEA_LEVEL;
    const wallHeight = 8;

    // Floor
    for (let x = -half; x < half; x++) {
      for (let z = -half; z < half; z++) {
        this.world.setBlock(x, baseY, z, BLOCK.STONE_BRICK);
      }
    }

    // Walls
    for (let i = -half; i < half; i++) {
      for (let y = 1; y <= wallHeight; y++) {
        this.world.setBlock(i, baseY + y, -half, BLOCK.STONE_BRICK);
        this.world.setBlock(i, baseY + y, half - 1, BLOCK.STONE_BRICK);
        this.world.setBlock(-half, baseY + y, i, BLOCK.STONE_BRICK);
        this.world.setBlock(half - 1, baseY + y, i, BLOCK.STONE_BRICK);
      }
    }

    this._rebuildArea(-half - 1, -half - 1, half + 1, half + 1);

    // Player position
    this.playerPos.set(-half + 3, baseY + 1.5, 0.5);
    this.spawnPos.copy(this.playerPos);

    // Give player iron sword
    this._addBlock(BLOCK.IRON_SWORD, 1);
    this._addBlock(BLOCK.COOKED_PORK, 10);
    this._syncHotbar();

    // Spawn Boss
    this._spawnBoss();

    // UI
    document.getElementById('advTitle').textContent = 'Boss战';
    document.getElementById('advObjective').textContent = '击败巨型僵尸';
    document.getElementById('advTimer').textContent = '0.0s';
    document.getElementById('advLives').textContent = '生命: ' + this.advLives;
    document.getElementById('bossHPBar').classList.add('visible');
  }

  _spawnBoss() {
    const baseY = this.world.getHeight(0, 0);
    const boss = new Mob(this.scene, 'zombie', 0, baseY, 0);
    boss.health = 100;
    boss.maxHealth = 100;
    boss.speed = 1.5;
    boss.state = 'chasing';

    // Make boss visually larger
    boss.group.scale.set(3, 3, 3);
    boss.body.scale.set(1, 1.5, 1);

    this.bossMob = boss;
    this.bossDefeated = false;
    this.bossSpawnTimer = 0;
    this.mobs.push(boss);
  }

  _updateBoss(dt) {
    if (!this.bossMob || this.bossMob.deathTimer >= 0) {
      if (this.bossMob && this.bossMob.deathTimer >= 0 && !this.bossDefeated) {
        this.bossDefeated = true;
        this.advActive = false;
        const elapsed = ((performance.now() - this.advStartTime) / 1000).toFixed(1);
        this._showResult(true, 'Boss战', '用时 ' + elapsed + ' 秒击败了 Boss');
        document.getElementById('bossHPBar').classList.remove('visible');
      }
      return;
    }

    // Boss charge attack: occasionally rush toward player
    const distToPlayer = this.bossMob.pos.distanceTo(this.playerPos);
    if (distToPlayer < 15 && Math.random() < 0.005) {
      const dir = new THREE.Vector3(
        this.playerPos.x - this.bossMob.pos.x, 0,
        this.playerPos.z - this.bossMob.pos.z
      ).normalize();
      this.bossMob.vel.x += dir.x * 15;
      this.bossMob.vel.z += dir.z * 15;
    }

    // Spawn mini zombies every 30 seconds
    this.bossSpawnTimer = (this.bossSpawnTimer || 0) + dt;
    if (this.bossSpawnTimer >= 30) {
      this.bossSpawnTimer = 0;
      for (let i = 0; i < 3; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = 5 + Math.random() * 5;
        const x = this.bossMob.pos.x + Math.cos(angle) * dist;
        const z = this.bossMob.pos.z + Math.sin(angle) * dist;
        const y = this.world.getHeight(Math.floor(x), Math.floor(z));
        if (y > 0) {
          const minion = new Mob(this.scene, 'zombie', x, y, z);
          minion.health = 15;
          minion.maxHealth = 15;
          this.mobs.push(minion);
        }
      }
    }

    // Boss contact damage is higher (handled in mob update, but override damage)
    // The boss's attack returns higher damage
    this.bossMob.attackCooldown = Math.max(0, this.bossMob.attackCooldown - dt);
  }
}

// ============================================================
//  GLOBAL INIT
// ============================================================
const game = new Game();
window.game = game;

// Also handle left click for attacking mobs (separate from block breaking)
document.addEventListener('mousedown', (e) => {
  if (!game.isPlaying || game.isInventoryOpen || game.isCraftOpen || game.isDead) return;
  if (e.button === 0) {
    // Check if we hit a mob first
    const dir = new THREE.Vector3();
    game.camera.getWorldDirection(dir);
    const origin = game.camera.position.clone();

    let closestMob = null;
    let closestDist = REACH;
    let blockHit = null;

    // Check mob hit (use larger hitbox for boss)
    for (const mob of game.mobs) {
      if (mob.deathTimer >= 0) continue;
      const isBoss = mob === game.bossMob;
      const hitRadius = isBoss ? 2.5 : 0.8;
      const hitDist = isBoss ? 12 : 0.6;
      const mobCenter = mob.pos.clone().add(new THREE.Vector3(0, isBoss ? 2 : 0.6, 0));
      const toMob = mobCenter.clone().sub(origin);
      const proj = toMob.dot(dir);
      if (proj < 0 || proj > (isBoss ? 12 : REACH)) continue;
      const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
      const dist = closest.distanceTo(mobCenter);
      if (dist < hitRadius && proj < closestDist) {
        closestDist = proj;
        closestMob = mob;
      }
    }

    // Check block hit
    const hit = raycast(game.world, origin, dir, REACH);
    if (hit && hit.t < closestDist) {
      blockHit = hit;
      closestMob = null;
    }

    if (closestMob) {
      // Calculate damage with weapon
      let dmg = 4;
      if (game.gameMode === 'survival' || game.gameMode === 'adventure') {
        if (game.equipment[0] === BLOCK.IRON_SWORD) dmg = 9;
      }
      // Creative: instakill
      if (game.gameMode === 'creative') dmg = 999;
      const dead = closestMob.takeDamage(dmg);
      game.sound.play('hit');
      const kbDir = closestMob.pos.clone().sub(game.playerPos).normalize();
      closestMob.vel.x += kbDir.x * 5;
      closestMob.vel.z += kbDir.z * 5;
      closestMob.state = 'fleeing';
      closestMob.walkTimer = 1;
    }
  }
});

</script>

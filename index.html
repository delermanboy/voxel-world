    this.playerPos.z = Math.max(-worldSize, Math.min(worldSize, this.playerPos.z));

    // Void death
    if (this.playerPos.y < -10) {
      this.health = 0;
    }

    // Head bob
    const isMoving = Math.abs(this.playerVel.x) + Math.abs(this.playerVel.z) > 1;
    if (this.onGround && isMoving) {
      this.headBob += dt * 10;
    } else {
      this.headBob *= 0.9;
    }

    // Land squash recovery
    this.landSquash *= Math.max(0, 1 - 8 * dt);

    // Head bob velocity recovery
    this.headBobVel *= Math.max(0, 1 - 6 * dt);

    // Camera position with bob
    const bobOffset = Math.sin(this.headBob) * 0.06 + this.headBobVel * 0.03;
    this.camera.position.set(
      this.playerPos.x,
      this.playerPos.y + 1.6 + bobOffset,
      this.playerPos.z
    );
  }

  _updateInteraction(dt) {
    if (this.isInventoryOpen || this.isCraftOpen) return;

    const dir = new THREE.Vector3();
    this.camera.getWorldDirection(dir);
    const hit = raycast(this.world, this.camera.position, dir, REACH);

    if (hit) {
      this.highlightMesh.visible = true;
      this.highlightMesh.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5);

      // Left click - break
      if (this.mouse.left) {
        if (!this.breakTarget || this.breakTarget.x !== hit.x || this.breakTarget.y !== hit.y || this.breakTarget.z !== hit.z) {
          this.breakTarget = { x: hit.x, y: hit.y, z: hit.z };
          this.breakProgress = 0;
        }
        this.breakProgress += dt * 2; // 0.5 second to break
        if (this.breakProgress >= 1) {
          if (hit.block !== BLOCK.BEDROCK) {
            // Particles
            const color = this._getBlockThreeColor(hit.block);
            this.particles.emit(hit.x, hit.y, hit.z, color, 6);
            // Drop item
            this.droppedItems.push(new DroppedItem(this.scene, hit.block, hit.x, hit.y, hit.z));
            this.world.setBlock(hit.x, hit.y, hit.z, BLOCK.AIR);
            this.sound.play('break');
          }
          this.breakProgress = 0;
          this.breakTarget = null;
        }
      }
    } else {
      this.highlightMesh.visible = false;
      this.breakTarget = null;
      this.breakProgress = 0;
    }

    // Right click - place
    if (this.mouse.right && hit) {
      this.mouse.right = false; // one-time place
      const [nx, ny, nz] = getFaceNormal(hit.face);
      const px = hit.x + nx, py = hit.y + ny, pz = hit.z + nz;

      // Don't place inside player
      const playerBox = {
        minX: this.playerPos.x - 0.3, maxX: this.playerPos.x + 0.3,
        minY: this.playerPos.y, maxY: this.playerPos.y + 1.8,
        minZ: this.playerPos.z - 0.3, maxZ: this.playerPos.z + 0.3,
      };
      const blockBox = { minX: px, maxX: px + 1, minY: py, maxY: py + 1, minZ: pz, maxZ: pz + 1 };
      if (playerBox.maxX > blockBox.minX && playerBox.minX < blockBox.maxX &&
          playerBox.maxY > blockBox.minY && playerBox.minY < blockBox.maxY &&
          playerBox.maxZ > blockBox.minZ && playerBox.minZ < blockBox.maxZ) return;

      const selectedBlock = this.hotbar[this.hotbarIdx];
      if (selectedBlock != null && this.inventory[selectedBlock] > 0) {
        if (this.world.getBlock(px, py, pz) === BLOCK.AIR || this.world.getBlock(px, py, pz) === BLOCK.WATER) {
          this.world.setBlock(px, py, pz, selectedBlock);
          this._removeBlock(selectedBlock, 1);
          this._updateHotbarUI();
          this.sound.play('place');
        }
      }
    }
  }

  _getBlockThreeColor(blockId) {
    const colors = {
      [BLOCK.GRASS]: 0x4caf50, [BLOCK.DIRT]: 0x8b6914, [BLOCK.STONE]: 0x808080,
      [BLOCK.WOOD]: 0x8b6914, [BLOCK.LEAVES]: 0x3a9f30, [BLOCK.SAND]: 0xe8d5a0,
      [BLOCK.COAL_ORE]: 0x333333, [BLOCK.IRON_ORE]: 0xd4b896, [BLOCK.GOLD_ORE]: 0xffd700,
      [BLOCK.DIAMOND_ORE]: 0x40e0d0, [BLOCK.PLANKS]: 0xbc9862, [BLOCK.STONE_BRICK]: 0x7a7a7a,
      [BLOCK.GLASS]: 0xc8dcff, [BLOCK.RED_FLOWER]: 0xe03030, [BLOCK.YELLOW_FLOWER]: 0xf0e040,
    };
    return colors[blockId] || 0xaaaaaa;
  }

  _updateMobs(dt) {
    // Spawn timer
    this.mobSpawnTimer += dt;
    if (this.mobSpawnTimer > 10 && this.mobs.length < 20) {
      this.mobSpawnTimer = 0;
      const isNight = this.dayTime < 0.25 || this.dayTime > 0.75;
      if (isNight) {
        // Spawn hostile mob
        const angle = Math.random() * Math.PI * 2;
        const dist = 20 + Math.random() * 20;
        const x = this.playerPos.x + Math.cos(angle) * dist;
        const z = this.playerPos.z + Math.sin(angle) * dist;
        const y = this.world.getHeight(Math.floor(x), Math.floor(z));
        if (y > SEA_LEVEL) {
          const type = Math.random() < 0.5 ? 'zombie' : 'skeleton';
          this.mobs.push(new Mob(this.scene, type, x, y, z));
        }
      } else if (this.mobs.filter(m => m.type !== 'zombie' && m.type !== 'skeleton').length < 8) {
        const types = ['pig', 'chicken', 'cow', 'sheep'];
        const type = types[(Math.random() * types.length) | 0];
        const angle = Math.random() * Math.PI * 2;
        const dist = 15 + Math.random() * 25;
        const x = this.playerPos.x + Math.cos(angle) * dist;
        const z = this.playerPos.z + Math.sin(angle) * dist;
        const y = this.world.getHeight(Math.floor(x), Math.floor(z));
        if (y > SEA_LEVEL) {
          this.mobs.push(new Mob(this.scene, type, x, y, z));
        }
      }
    }

    // Update mobs
    const playerCenter = new THREE.Vector3(
      this.playerPos.x, this.playerPos.y + 0.9, this.playerPos.z
    );

    for (let i = this.mobs.length - 1; i >= 0; i--) {
      const mob = this.mobs[i];
      const result = mob.update(dt, playerCenter, this.world);

      if (result === true) {
        // Mob dead or despawned
        mob.dispose(this.scene);
        this.mobs.splice(i, 1);
        continue;
      }

      if (result && result.attack) {
        this.takeDamage(result.damage);
      }

      // Despawn far mobs
      const dist = mob.pos.distanceTo(playerCenter);
      if (dist > 80) {
        mob.dispose(this.scene);
        this.mobs.splice(i, 1);
      }
    }
  }

  _updateDroppedItems(dt) {
    const pp = this.playerPos;
    for (let i = this.droppedItems.length - 1; i >= 0; i--) {
      const item = this.droppedItems[i];
      const collected = item.update(dt, pp, this.world);
      if (collected || item.collected) {
        if (item.collected) {
          this._addBlock(item.blockId, 1);
          this._syncHotbar();
          this._updateHotbarUI();
          this.sound.play('hit');
        }
        item.dispose(this.scene);
        this.droppedItems.splice(i, 1);
      } else if (item.life <= 0) {
        item.dispose(this.scene);
        this.droppedItems.splice(i, 1);
      }
    }
  }

  _updateDayNight(dt) {
    this.dayTime = (this.dayTime + this.daySpeed * dt) % 1;

    // Sun angle
    const sunAngle = this.dayTime * Math.PI * 2 - Math.PI / 2;
    const sunDist = 70;
    this.sunLight.position.set(
      Math.cos(sunAngle) * sunDist,
      Math.sin(sunAngle) * sunDist,
      30
    );

    // Position sun/moon meshes (follow camera xz so they always appear in sky)
    const camX = this.playerPos.x, camZ = this.playerPos.z;
    this.sunMesh.position.set(
      camX + Math.cos(sunAngle) * sunDist,
      Math.sin(sunAngle) * sunDist,
      camZ + 30
    );
    this.sunMesh.visible = Math.sin(sunAngle) > -0.2;
    this.moonMesh.position.set(
      camX + Math.cos(sunAngle + Math.PI) * sunDist,
      Math.sin(sunAngle + Math.PI) * sunDist,
      camZ + 30
    );
    this.moonMesh.visible = Math.sin(sunAngle) < 0.2;

    // Light intensity based on time
    const sunHeight = Math.sin(sunAngle);
    const dayFactor = Math.max(0, Math.min(1, sunHeight * 2 + 0.5));

    this.sunLight.intensity = dayFactor * 1.0;
    this.ambientLight.intensity = 0.15 + dayFactor * 0.5;
    this.hemiLight.intensity = 0.1 + dayFactor * 0.3;

    // Sky color
    const nightColor = new THREE.Color(0x0a0a1a);
    const dayColor = new THREE.Color(0x87ceeb);
    const sunsetColor = new THREE.Color(0xff8844);

    let skyColor;
    if (dayFactor > 0.6) {
      skyColor = dayColor;
    } else if (dayFactor > 0.3) {
      const t = (dayFactor - 0.3) / 0.3;
      skyColor = sunsetColor.clone().lerp(dayColor, t);
    } else {
      const t = dayFactor / 0.3;
      skyColor = nightColor.clone().lerp(sunsetColor, t);
    }

    this.scene.background = skyColor;
    this.scene.fog.color = skyColor;

    // Move clouds
    for (const cloud of this.cloudMeshes) {
      cloud.mesh.position.x += cloud.speed * dt;
      if (cloud.mesh.position.x > 60) cloud.mesh.position.x = -60;
    }
  }

  takeDamage(amount) {
    if (this.health <= 0) return;
    this.health = Math.max(0, this.health - amount);
    this.sound.play('hurt');
    this._updateHealthUI();

    // Flash damage overlay
    const overlay = document.getElementById('damageOverlay');
    overlay.classList.add('active');
    setTimeout(() => overlay.classList.remove('active'), 200);

    if (this.health <= 0) {
      this._die();
    }
  }

  _die() {
    this.health = this.maxHealth;
    this._updateHealthUI();
    const spawn = this.world.findSpawnPos();
    this.playerPos.copy(spawn);
    this.playerVel.set(0, 0, 0);
    this.camera.position.copy(this.playerPos);
  }

  _attackMob() {
    const dir = new THREE.Vector3();
    this.camera.getWorldDirection(dir);
    const origin = this.camera.position.clone();
    const range = REACH;

    // Simple ray-sphere intersection with mobs
    let closestMob = null;
    let closestDist = range;

    for (const mob of this.mobs) {
      if (mob.deathTimer >= 0) continue;
      const toMob = mob.pos.clone().add(new THREE.Vector3(0, 0.6, 0)).sub(origin);
      const proj = toMob.dot(dir);
      if (proj < 0 || proj > range) continue;
      const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
      const dist = closest.distanceTo(mob.pos.clone().add(new THREE.Vector3(0, 0.6, 0)));
      if (dist < 0.8 && proj < closestDist) {
        closestDist = proj;
        closestMob = mob;
      }
    }

    if (closestMob) {
      const dead = closestMob.takeDamage(4);
      this.sound.play('hit');
      // Knockback
      const kbDir = closestMob.pos.clone().sub(this.playerPos).normalize();
      closestMob.vel.x += kbDir.x * 5;
      closestMob.vel.z += kbDir.z * 5;
      closestMob.state = 'fleeing';
      closestMob.walkTimer = 1;

      if (dead) {
        // Drop item
        if (Math.random() < 0.5) {
          // Drop some item
        }
      }
    }
  }

  _loop() {
    if (!this.isPlaying) return;
    requestAnimationFrame(() => this._loop());

    const dt = Math.min(this.clock.getDelta(), 0.1);
    this.accumulatedTime += dt;

    // Fixed timestep for physics
    while (this.accumulatedTime >= TICK_RATE) {
      this._updatePhysics(TICK_RATE);
      this.accumulatedTime -= TICK_RATE;
    }

    this._updateInteraction(dt);
    this._updateMobs(dt);
    this._updateDroppedItems(dt);
    this.particles.update(dt);
    this._updateDayNight(dt);

    // FPS counter
    this._fpsFrames++;
    this._fpsTime += dt;
    if (this._fpsTime >= 1) {
      this._fpsValue = this._fpsFrames / this._fpsTime;
      this._fpsFrames = 0;
      this._fpsTime = 0;
    }

    this._updateDebugInfo();

    // Handle attack on left click (instant, not held)
    // Already handled through mouse.left in interaction

    this.renderer.render(this.scene, this.camera);
  }
}

// ============================================================
//  GLOBAL INIT

const game = new Game();
window.game = game;

// Also handle left click for attacking mobs (separate from block breaking)
document.addEventListener('mousedown', (e) => {
  if (!game.isPlaying || game.isInventoryOpen || game.isCraftOpen) return;
  if (e.button === 0) {
    // Check if we hit a mob first
    const dir = new THREE.Vector3();
    game.camera.getWorldDirection(dir);
    const origin = game.camera.position.clone();

    let closestMob = null;
    let closestDist = REACH;
    let blockHit = null;

    // Check mob hit
    for (const mob of game.mobs) {
      if (mob.deathTimer >= 0) continue;
      const mobCenter = mob.pos.clone().add(new THREE.Vector3(0, 0.6, 0));
      const toMob = mobCenter.clone().sub(origin);
      const proj = toMob.dot(dir);
      if (proj < 0 || proj > REACH) continue;
      const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
      const dist = closest.distanceTo(mobCenter);
      if (dist < 0.8 && proj < closestDist) {
        closestDist = proj;
        closestMob = mob;
      }
    }

    // Check block hit
    const hit = raycast(game.world, origin, dir, REACH);
    if (hit && hit.t < closestDist) {
      blockHit = hit;
      closestMob = null;
    }

    if (closestMob) {
      const dead = closestMob.takeDamage(4);
      game.sound.play('hit');
      const kbDir = closestMob.pos.clone().sub(game.playerPos).normalize();
      closestMob.vel.x += kbDir.x * 5;
      closestMob.vel.z += kbDir.z * 5;
      closestMob.state = 'fleeing';
      closestMob.walkTimer = 1;
    }
  }
});
